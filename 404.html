<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="settings.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABT Code — Page introuvable</title>
    <script src="themes.js"></script>
    <link rel="stylesheet" href="responsive.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg,#0d0f14);color:var(--text,#e2e8f0);font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
        .wrap{max-width:480px;}
        .code{font-size:6rem;font-weight:800;color:var(--accent,#4f8ef7);line-height:1;margin-bottom:16px;font-family:monospace;}
        h1{font-size:1.6rem;margin-bottom:10px;}
        p{color:var(--muted,#64748b);margin-bottom:28px;line-height:1.6;}
        .btn{display:inline-block;background:var(--accent,#4f8ef7);color:white;padding:12px 28px;border-radius:9px;text-decoration:none;font-weight:700;transition:all 0.2s;margin:4px;}
        .btn:hover{opacity:0.85;transform:translateY(-2px);}
        .btn-ghost{background:transparent;border:1px solid var(--border,#2a2f45);color:var(--muted,#64748b);}
        .btn-ghost:hover{border-color:var(--accent,#4f8ef7);color:var(--accent,#4f8ef7);}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>Page introuvable</h1>
        <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
        <a href="dashboard.html" class="btn">🏠 Retour à l'accueil</a>
        <a href="javascript:history.back()" class="btn btn-ghost">← Retour</a>
    </div>
<script src="abt_ai.js"></script>
</body>
</html>
